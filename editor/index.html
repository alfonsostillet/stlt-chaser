<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>STLT-CHASER</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">STLT-CHASER</div>
        <label class="pill zoom" title="Zoom (Ctrl + / Ctrl -, mouse wheel)"><input id="zoom-input" type="text" />%</label>
        <button id="fit-button" class="icon" title="Fit the stage to the window">&#x26F6;&#xFE0E;</button>
        <button id="hand-button" class="icon" title="Hand tool (hold Space)">&#x270B;&#xFE0E;</button>
        <div class="divider"></div>
        <button id="undo-button" class="icon" title="Undo (Ctrl+Z)">&#x21B6;</button>
        <button id="redo-button" class="icon" title="Redo (Ctrl+Y)">&#x21B7;</button>
        <div class="divider"></div>
        <div id="doc-name"></div>
        <div id="save-state"></div>
        <div id="message"></div>
      </header>
      <nav id="menu">
        <button data-panel="file">File</button>
        <button data-panel="views">Views</button>
        <button data-panel="sequences">Sequences</button>
        <button data-panel="factory">Factory</button>
        <button data-panel="envelopes">Envelopes</button>
        <button data-panel="export">Export</button>
        <div class="spacer"></div>
        <div class="version">v0.1</div>
      </nav>
      <aside id="panel" hidden></aside>
      <main id="stage">
        <canvas id="canvas"></canvas>
        <div id="envelope-editor" hidden></div>
        <div id="export-view" hidden></div>
      </main>
      <footer id="sequencer"></footer>
    </div>
    <script src="dev/mock-host.js"></script>
    <script type="module" src="src/app.mjs"></script>
  </body>
</html>
