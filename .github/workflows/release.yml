name: Build and release

# Every push and pull request builds and tests both platforms.
# Pushing a tag like v1.0.0 also publishes a GitHub release with the installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            dist: dist:win
            artifact: windows
            files: editor/release/*.exe
          - os: macos-14
            dist: dist:mac
            artifact: macos
            files: editor/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the plugins
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build --config Release
          cmake --install plugin/build --prefix plugin/dist --config Release

      - name: Test the document loader
        shell: bash
        run: |
          if [ -f plugin/build/Release/document_test.exe ]; then plugin/build/Release/document_test.exe; else plugin/build/document_test; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Test the editor
        working-directory: editor
        run: |
          npm ci
          npm test

      - name: Package the editor with the plugins
        working-directory: editor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: STLT-CHASER-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
