name: Build and release

# Every push and pull request builds and tests both platforms.
# Pushing a tag like v1.0.0, or a manual run with a release tag, also publishes a GitHub release with the installers
# attached; a manual run creates the tag on the commit it built.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v1.3.0); empty for a plain build"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            dist: dist:win
            artifact: windows
            files: editor/release/*.exe
          - os: macos-15 # Apple Silicon; macos-14 jobs have been cancelled before starting since November 2026
            dist: dist:mac
            artifact: macos
            files: editor/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the plugins
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build --config Release
          cmake --install plugin/build --prefix plugin/dist --config Release

      # A host finds a plugin through plugMain alone; a bundle without it does not load.
      - name: Check the plugin bundles export plugMain
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          bundles=(plugin/dist/*.bundle)
          if [ ${#bundles[@]} -eq 0 ]; then echo "::error::No plugin bundles in plugin/dist"; exit 1; fi
          status=0
          for bundle in "${bundles[@]}"; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .bundle)"
            for arch in $(lipo -archs "$binary"); do
              for symbol in _plugMain _SetLogCallback; do
                if nm -gU -arch "$arch" "$binary" | grep -q " $symbol\$"; then
                  echo "$bundle ($arch) exports $symbol"
                else
                  echo "::error::$bundle ($arch) does not export $symbol"
                  status=1
                fi
              done
            done
          done
          exit $status

      - name: Test the document loader
        shell: bash
        run: |
          if [ -f plugin/build/Release/document_test.exe ]; then plugin/build/Release/document_test.exe; else plugin/build/document_test; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Test the editor
        working-directory: editor
        run: |
          npm ci
          npm test

      - name: Package the editor with the plugins
        working-directory: editor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: STLT-CHASER-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
